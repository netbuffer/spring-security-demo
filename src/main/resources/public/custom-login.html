<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - JSON 凭据认证</title>
    <script src="/tailwind.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 mb-3 font-bold text-2xl shadow-inner">
                ⚡
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-800">Spring Security Demo</h1>
            <p class="text-sm text-slate-500 mt-1">JSON 异步登录 (CustomLoginFilter)</p>
        </div>

        <!-- 切换登录模式导航 -->
        <div class="flex border-b border-slate-200 text-sm font-medium text-center">
            <a href="/login.html" class="flex-1 py-2.5 text-slate-500 hover:text-slate-800 transition">表单登录</a>
            <a href="/custom-login.html" class="flex-1 py-2.5 border-b-2 border-indigo-600 text-indigo-600">JSON 登录</a>
            <a href="/custom-token-login.html" class="flex-1 py-2.5 text-slate-500 hover:text-slate-800 transition">Token 登录</a>
        </div>

        <form action="/your-custom-login-path" method="post" onsubmit="return false" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
                <input name="username" type="text" value="admin" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                       placeholder="admin 或 test"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
                <input name="password" type="password" value="admin" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                       placeholder="admin 或 test"/>
            </div>

            <div class="flex items-center justify-between text-sm">
                <span class="text-slate-500">接口: <code>POST /your-custom-login-path</code></span>
                <a href="/logout.html" class="text-indigo-600 hover:underline">退出测试页 &rarr;</a>
            </div>

            <button type="button" onclick="login()"
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-medium rounded-lg shadow-sm hover:shadow transition duration-150">
                JSON 异步登录
            </button>
        </form>

        <div id="msgBox" class="hidden p-3 rounded-lg text-sm transition"></div>

        <div class="pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1">
            <p class="font-medium text-slate-600">💡 机制说明：</p>
            <p>• 发送 <code>application/json</code> 请求体 <code>{"username":"...","password":"..."}</code></p>
            <p>• 登录成功返回 Session 信息，失败返回错误 JSON 提示</p>
        </div>
    </div>

    <script>
        function login() {
            const user = document.querySelector("input[name='username']").value;
            const password = document.querySelector("input[name='password']").value;
            const msgBox = document.getElementById("msgBox");

            msgBox.className = "p-3 rounded-lg text-sm bg-blue-50 text-blue-700 block";
            msgBox.innerText = "登录中...";

            fetch("/your-custom-login-path", {
                body: JSON.stringify({
                    "username": user,
                    "password": password
                }),
                headers: {
                    'content-type': 'application/json'
                },
                method: 'POST'
            })
            .then(response => response.json())
            .then(json => {
                console.log("response json:", json);
                if (json.session) {
                    msgBox.className = "p-3 rounded-lg text-sm bg-emerald-50 text-emerald-700 block";
                    msgBox.innerText = "✅ 登录成功，即将跳转至 /info ...";
                    setTimeout(() => location.href = "/info", 600);
                } else {
                    msgBox.className = "p-3 rounded-lg text-sm bg-rose-50 text-rose-700 block";
                    msgBox.innerText = "❌ 登录失败: " + (json.msg || "用户名或密码错误");
                }
            })
            .catch(err => {
                msgBox.className = "p-3 rounded-lg text-sm bg-rose-50 text-rose-700 block";
                msgBox.innerText = "❌ 网络错误: " + err.message;
            });
        }
    </script>
</body>
</html>
