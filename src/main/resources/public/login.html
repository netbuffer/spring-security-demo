<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - 表单认证</title>
    <script src="/tailwind.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-50 text-blue-600 mb-3 font-bold text-2xl shadow-inner">
                🔐
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-800">Spring Security Demo</h1>
            <p class="text-sm text-slate-500 mt-1">标准 Form 表单登录演示</p>
        </div>

        <!-- 切换登录模式导航 -->
        <div class="flex border-b border-slate-200 text-sm font-medium text-center">
            <a href="/login.html" class="flex-1 py-2.5 border-b-2 border-blue-600 text-blue-600">表单登录</a>
            <a href="/custom-login.html" class="flex-1 py-2.5 text-slate-500 hover:text-slate-800 transition">JSON 登录</a>
            <a href="/custom-token-login.html" class="flex-1 py-2.5 text-slate-500 hover:text-slate-800 transition">Token 登录</a>
        </div>

        <!-- 错误提示或注销提示框 -->
        <div id="errorAlert" class="hidden p-3 rounded-lg text-sm bg-rose-50 border border-rose-200 text-rose-700 flex items-center space-x-2">
            <span>❌</span>
            <span>用户名或密码错误，请重试！</span>
        </div>
        <div id="logoutAlert" class="hidden p-3 rounded-lg text-sm bg-emerald-50 border border-emerald-200 text-emerald-700 flex items-center space-x-2">
            <span>✅</span>
            <span>您已安全退出系统。</span>
        </div>

        <form action="/your-login-path" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
                <input name="username" type="text" value="admin" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                       placeholder="admin 或 test"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
                <input name="password" type="password" value="admin" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                       placeholder="admin 或 test"/>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2 text-sm text-slate-600 cursor-pointer select-none">
                    <input type="checkbox" name="rme" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300"/>
                    <span>记住我 (Remember Me)</span>
                </label>
                <a href="/logout.html" class="text-sm text-blue-600 hover:underline">退出测试页 &rarr;</a>
            </div>

            <input type="hidden" name="_csrf"/>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-medium rounded-lg shadow-sm hover:shadow transition duration-150">
                登 录
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1">
            <p class="font-medium text-slate-600">💡 测试提示：</p>
            <p>• 管理员：<code>admin / admin</code>（具备 admin 权限）</p>
            <p>• 测试员：<code>test / test</code>（具备 test 权限）</p>
            <p>• 登录成功默认重定向至 <code>/info</code></p>
        </div>
    </div>

    <script>
        const getCookiesObj = () => {
            return document.cookie
                .split(';')
                .reduce((f, sv) => {
                    let _sv = sv.trim()
                        .split('=')
                        .map(v => v.trim());
                    if (_sv[0]) {
                        f[_sv[0]] = _sv[1];
                    }
                    return f;
                }, {});
        };
        let cookie = getCookiesObj();
        let token = cookie["csrf-token"];
        console.log("csrf token=%s", token);
        if (token) {
            document.querySelector("input[name='_csrf']").value = token;
        }

        // 解析 URL 参数以展示错误或退出提示
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('errorAlert').classList.remove('hidden');
        }
        if (urlParams.has('logout')) {
            document.getElementById('logoutAlert').classList.remove('hidden');
        }
    </script>
</body>
</html>
