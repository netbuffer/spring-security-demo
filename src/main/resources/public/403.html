<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - 访问被拒绝</title>
    <script src="/tailwind.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center space-y-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-50 text-rose-600 text-3xl font-bold shadow-inner">
            ⛔
        </div>

        <div class="space-y-2">
            <span class="inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full bg-rose-100 text-rose-700">HTTP 403 Forbidden</span>
            <h1 class="text-2xl font-bold text-slate-800">访问被拒绝</h1>
            <p class="text-sm text-slate-500">您没有权限访问该受保护资源，或 CSRF Token 验证失败。</p>
        </div>

        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-left text-xs text-slate-600 space-y-1">
            <p class="font-semibold text-slate-700">可能的触发原因：</p>
            <p>1. 当前账号角色权限不足（例如访问 <code>/admin</code> 需要 <code>admin</code> 权限）</p>
            <p>2. POST/PUT 请求缺少合法的 CSRF Cookie 或 Token</p>
            <p>3. 细粒度权限校验 (<code>PermissionEvaluator</code>) 不匹配</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <a href="/login.html"
               class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm shadow-sm transition duration-150">
                重新登录
            </a>
            <a href="/logout.html"
               class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm transition duration-150">
                前往退出页
            </a>
            <a href="/info"
               class="flex-1 py-2.5 px-4 border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-lg text-sm transition duration-150">
                公共接口
            </a>
        </div>
    </div>
</body>
</html>
